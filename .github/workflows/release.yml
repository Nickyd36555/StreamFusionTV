name: Build and publish APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Restore signing key
        run: echo "$FUSION_KEYSTORE_BASE64" | base64 --decode > streamfusion.keystore
        env:
          FUSION_KEYSTORE_BASE64: ${{ secrets.FUSION_KEYSTORE_BASE64 }}
      - name: Build signed release
        run: ./gradlew assembleRelease
        env:
          FUSION_KEYSTORE_FILE: ${{ github.workspace }}/streamfusion.keystore
          FUSION_KEYSTORE_PASSWORD: ${{ secrets.FUSION_KEYSTORE_PASSWORD }}
          FUSION_KEY_ALIAS: ${{ secrets.FUSION_KEY_ALIAS }}
          FUSION_KEY_PASSWORD: ${{ secrets.FUSION_KEY_PASSWORD }}
      - name: Name APK
        run: |
          VERSION_NAME=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          VERSION_CODE=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts)
          echo "RELEASE_TAG=stream-fusion-tv-v${VERSION_CODE}" >> "$GITHUB_ENV"
          echo "APK_NAME=StreamFusionTV-${VERSION_NAME}.apk" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/release/app-release.apk "StreamFusionTV-${VERSION_NAME}.apk"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: ${{ env.APK_NAME }}
          generate_release_notes: true
